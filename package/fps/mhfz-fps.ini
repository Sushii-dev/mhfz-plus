[fps]
; MHFZ Plus frame-rate mod settings. Changes apply while the game runs (the file is re-read when saved).
; Delete this file to get the defaults back (MHFZ Plus copies a fresh one at the next start).

; 1 = on, 0 = off (pure pass-through, the game runs exactly as without the mod)
enabled=1
; 2 = interpolate (normal), 0 = vanilla 30 fps with the mod loaded, 1 = repeat frames without interpolation (testing)
mode=2
; frame-rate target: 0 = just below your monitor's refresh rate (144 Hz -> ~140 fps, 60 Hz -> ~58 fps),
; or a number such as 60 / 120 / 144
target_fps=0
; vsync for the extra frames: 0 = off (best with windowed mode, G-Sync/FreeSync), 1 = on (try it if you play in
; exclusive fullscreen without G-Sync/FreeSync and see tearing), -1 = whatever the game asks for
present_interval=0
; 0 = keep the game's own tick timing exactly (recommended)
precise_tick=0

; keys (virtual-key codes, 0 = no key; hotkeys=0 disables all of them):
;   Pause  (key_toggle=19)   mod on/off while playing, to compare
;   Insert (key_overlay=45)  FPS counter: press once for the counter (frames per second, the slowest 1% of frames,
;                            the game's own 30), again for the detailed view (frame times and a graph of the last
;                            240 frames: blue = game frame, green = in-between frame, red = hitch), again to hide it
;   Delete (key_capture=46)  saves a clip of the last second: if something looks wrong (a flicker, a jump, a
;                            flash), press Delete right after you see it. A message confirms it ("Clip 1 saved").
;                            The clips are in the "retro" folder next to mhfz-fps.log (with MHFZ Plus on Rain:
;                            %LOCALAPPDATA%\MHFZ-Plus\fps-state\rain\retro-1, -2 ... after the game is closed).
;                            Zip the folder and send it with mhfz-fps.log - it shows exactly what went wrong.
hotkeys=1
key_toggle=19
key_overlay=45
key_capture=46
; overlay=1 shows the counter from the start (2 = the detailed view); position 0 top left, 1 top right,
; 2 bottom left, 3 bottom right, 4 top centre; size 0 = automatic, 1-4 = fixed
overlay=0
overlay_pos=0
overlay_scale=0
; the clip recorder behind the Delete key: keeps the last frames in video memory (about 400 MB at 1080p,
; 1 GB at 1440p ultrawide); 0 = off (Delete then does nothing)
retro=1

; lower input latency (testing): after each of the game's own frames the game waits the little time the
; next frames would have waited anyway, so it reads your input later. No frames are lost and the game
; runs at the same speed. 1 = on. Ctrl+Shift+5 switches it while playing.
latency_trim=0

; catch quick taps (testing): the game reads keyboard, mouse and controller once per tick, so a very quick
; tap can fall between two reads and get lost (a menu press that does nothing). 1 = such taps are caught
; and handed to the game at its next read. Nothing is delayed.
input_latch=0

; developer keys (Ctrl+Shift+F7..F12, debug views): off
debug_keys=0
key_debug=0
key_mode=0

; mhfz-fps.log in the game folder: a stats line every 60 seconds (0 = off). Include mhfz-fps.log and
; mhfz-fps.prev.log (the session before) when you report a problem.
stats_interval=60

; developer tools: off
debug_unlerped=0
debug_marker=0
selfcheck=0
trace_interval_s=0
